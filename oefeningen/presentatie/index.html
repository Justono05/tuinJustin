# Onderwerp

Wat is jouw interesse, waarom, wat, hoe (Mijn onderwerp dat ik interessant vind is het bouwen en samenstellen van computers! Ik keek veel naar kanalen die de nieuweste tech bespraken, en vond het zelf leuk de onderdelen in Tweakers samen te stellen.
Wat ik in mijn digital garden wil gaan maken is een uitleg in chronologische volgorde die verteld wat je nodig hebt voor het bouwen van een computer. Naarmate je door de componenten scrolt kan je wat lezen over het component zelf. Het wordt dus een soort Guide.

# 10 links

Welke 10 links heb je gelezen, geraadpleegd ter inspiratie, verdieping? Wat heb je daaruit gehaald?

<a href="https://tweakers.net/">Tweakers</a>
Tweakers is een soort forum met de nieuwste tech info, ook kan je er een wenslijst maken en alle computer componenten vinden met prijzen en info over dat component.
Met deze site begon mijn hele interesse in computers bouwen.

<a href="https://www.reddit.com/">Reddit</a>
Op Reddit kan je voor bijna elke vraag die je maar hebt antwoord op vinden. Hier heb ik problemen met mijn computer mee opgelost, of vragen over verschillen in componenten een antwoord op gevonden.

<a href="https://www.youtube.com/@LinusTechTips">LinusTechTips (youtube)</a>
<a href="https://www.youtube.com/@Jayztwocents">Jayztwocents (youtube)</a>
Dit zijn twee youtube kanalen met computer bouw tips. Ze behandelen ook de nieuwste tech van de bekenste bedrijven die componenten maken. Ook maken ze leuke test videos.

<a href="https://www.youtube.com/watch?v=xYmOhUXgUp0">Ram timings explained (youtube)</a>
Deze video heeft me eigenlijk op het idee gebracht om mijn Digital Garden over computers bouwen te houden, aangezien er veel dingen zijn om rekening mee te houden.

<a href="https://www.tomshardware.com/">tomshardware</a>
<a href="https://www.corsair.com/eu/en">corsair</a>
Tomshardware is eigenlijk ook een soort reddit, alleen dan professioneler, niet iedereen kan dingen op dit forum schrijven. Corsair is een van de grootste en bekenste merken als het gaat om componenten maken, maar ze hebben ook een leuk forum met hot topics.

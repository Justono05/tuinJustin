# Onderwerp

Mijn onderwerp dat ik interessant vind is het bouwen en samenstellen van computers! Ik keek veel naar kanalen die de nieuweste tech bespraken, en vond het zelf leuk de onderdelen in Tweakers samen te stellen.
Wat ik in mijn digital garden wil gaan maken is een uitleg in chronologische volgorde die verteld wat je nodig hebt voor het bouwen van een computer. Naarmate je door de componenten scrolt kan je wat lezen over het component zelf. Het wordt dus een soort Guide.

# 10 links

<a href="https://tweakers.net/">Tweakers</a>
<p>Tweakers is een soort forum met de nieuwste tech info, ook kan je er een wenslijst maken en alle computer componenten vinden met prijzen en info over dat component.
Met deze site begon mijn hele interesse in computers bouwen.</p>

<a href="https://www.reddit.com/">Reddit</a>
<p>Op Reddit kan je voor bijna elke vraag die je maar hebt antwoord op vinden. Hier heb ik problemen met mijn computer mee opgelost, of vragen over verschillen in componenten een antwoord op gevonden.</p>

<a href="https://www.youtube.com/@LinusTechTips">LinusTechTips (youtube)</a>
<a href="https://www.youtube.com/@Jayztwocents">Jayztwocents (youtube)</a>
<p>Dit zijn twee youtube kanalen met computer bouw tips. Ze behandelen ook de nieuwste tech van de bekenste bedrijven die componenten maken. Ook maken ze leuke test videos.</p>

<a href="https://www.youtube.com/watch?v=xYmOhUXgUp0">Ram timings explained (youtube)</a>
<p>Deze video heeft me eigenlijk op het idee gebracht om mijn Digital Garden over computers bouwen te houden, aangezien er veel dingen zijn om rekening mee te houden.</p>

<a href="https://www.tomshardware.com/">tomshardware</a>
<a href="https://www.corsair.com/eu/en">corsair</a>
<p>Tomshardware is eigenlijk ook een soort reddit, alleen dan professioneler, niet iedereen kan dingen op dit forum schrijven. Corsair is een van de grootste en bekenste merken als het gaat om componenten maken, maar ze hebben ook een leuk forum met hot topics.</p>

<a href="https://www.intel.com/content/www/us/en/gaming/resources/cpu-cooler-liquid-cooling-vs-air-cooling.html">Lucht vs waterkoeling</a>
<a href="https://www.rtings.com/tv/learn/qd-oled-vs-woled">Verschillen tussen soorten oled beeldscherm</a>
<a href="https://www.corsair.com/us/en/explorer/diy-builder/blogs/positive-pressure-vs-negative-pressure-which-is-best-for-a-gaming-pc/?srsltid=AfmBOoq-fGaSHrOCG6-9AeGoGhEdIrNmIKI0evRN41MoX9AL8Hs45hVs">Negative vs positive air pressure</a>
<p>recente interesses van mij waarover ik me aan het verdiepen ben</p>

# Introtekst

Een eigen computer bouwen is lastig, daarom is deze guide gemaakt om jou te helpen. Hier leer je in chronlogische volgorde hoe je een computer moet bouwen en krijg je over elk component iets te weten.

wat ik wil vertellen over het onderwerp: Wat elk component doet, waar je op moet letten en in welke volgorde je de computer moet bouwen.

hoe wil ik dit doen: afbeeldingen met knoppen eromheen die stukjes tekst uitklappen, scrollable animaties.
